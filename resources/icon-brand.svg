<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- my-cool-plugin 市场身份图（Type-2 彩色身份图）「一叠便签」
       意象 = 便签板：两张错位的便签纸 + 前纸折角 + 三行手写行（后纸只露一道边，读作「一叠」而非「一张」）
       为什么需要它：本插件是**图标栏插件** —— `icon` = resources/icon.svg 是 24×24 `currentColor` 线稿，
       按三图模型那是 Type-1（只给图标栏）；市场侧栏行/详情顶要的是 Type-2 彩色身份图，此前一直缺
       ⇒ 目录条目里存的是包内相对路径，未装用户看到的是默认彩块。
       家族 DNA（与官方 18 只同源）：40×40 圆角方载体 + 135° 双档渐变 + 白玻璃罩 + 发丝光边。 -->
  <defs>
    <linearGradient id="mcpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="mcpSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#mcpBg)"/>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#mcpSheen)"/>
  <rect x="4.5" y="4.5" width="39" height="39" rx="9.5" fill="none" stroke="#FEF3C7" stroke-opacity="0.42"/>

  <!-- 后面那张便签（只沿左上露一道边 = 一叠） -->
  <rect x="12.2" y="12" width="21" height="21" rx="2.4" fill="#FFFBEB" opacity="0.45"/>

  <!-- 前面那张便签（右下折角） -->
  <path d="M14.5 16.6 A2.4 2.4 0 0 1 16.9 14.2 H33.1 A2.4 2.4 0 0 1 35.5 16.6 V30.2 L30.5 35.2 H16.9 A2.4 2.4 0 0 1 14.5 32.8 Z"
        fill="#FFFBEB"/>
  <!-- 折角面 -->
  <path d="M30.5 35.2 V30.2 H35.5 Z" fill="#FDE68A"/>

  <!-- 三行字（琥珀墨色，长度不一 = 手写过的痕迹） -->
  <g fill="#B45309">
    <rect x="18" y="18.6" width="12" height="1.9" rx="0.95"/>
    <rect x="18" y="23.1" width="13.5" height="1.9" rx="0.95"/>
    <rect x="18" y="27.6" width="7" height="1.9" rx="0.95"/>
  </g>
</svg>
